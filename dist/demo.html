<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f4a3a">
<title>Kampus Netizen</title>
<style>
  :root{
    --green:#2f4a3a; --green2:#3f6650; --cream:#fffaf0; --cream2:#f6eedc; --brown:#8a6240;
    --ink:#1f2a24; --muted:#6c7a70; --gold:#f2c94c; --red:#e2483d;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#7fb069;font-family:var(--font);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  canvas#game{position:fixed;inset:0;display:block}
  button{font-family:inherit;cursor:pointer}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  #topbar h1{margin:0;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:22px;font-weight:900;letter-spacing:.2px;white-space:nowrap}
  #clock{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  #online{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
  #online i{width:9px;height:9px;border-radius:50%;background:#5ee07a;display:inline-block;box-shadow:0 0 0 3px rgba(94,224,122,.25)}
  #datetime{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  #phase{background:#ffe9a8;color:#7a5a12;font-size:12px;font-weight:900;letter-spacing:2px;padding:2px 12px;border-radius:999px;white-space:nowrap}
  #ktpBtn{flex:0 0 auto;background:var(--cream);color:var(--ink);border:3px solid var(--brown);border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}

  /* ---------- cards & controls ---------- */
  .card{background:var(--cream);border:3px solid var(--brown);border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #wargaCard{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 84px);padding:10px 16px;z-index:4;pointer-events:none}
  #wargaCard small{display:block;font-size:12px;font-weight:900;letter-spacing:3px;color:var(--brown)}
  #wargaCard b{display:block;font-size:34px;font-weight:900;line-height:1.05}
  #wargaCard span{font-size:11px;color:var(--muted)}
  #rightCtl{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 84px);display:flex;flex-direction:column;gap:10px;z-index:4}
  .ctl{width:56px;height:56px;border-radius:14px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:26px;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
  .ctl.small{font-size:13px}
  .ctl:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #chatTab{position:fixed;left:-14px;top:52%;transform:translateY(-50%);background:var(--green);color:#fff;border:none;border-radius:0 40px 40px 0;padding:16px 14px 14px 26px;font-weight:900;font-size:11px;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  #chatTab svg{width:26px;height:26px}

  /* ---------- joystick ---------- */
  #joy{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom) + 96px);width:150px;height:150px;border-radius:50%;background:rgba(40,60,50,.35);border:3px solid rgba(255,255,255,.35);z-index:4;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--cream);border:4px solid var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  #joyLabel{position:fixed;left:20px;width:150px;text-align:center;bottom:calc(env(safe-area-inset-bottom) + 76px);color:#fff;font-weight:900;letter-spacing:2px;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:4;pointer-events:none}

  /* ---------- bottom nav ---------- */
  #nav{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1px solid #e5dccb;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:6}
  #nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8f978f;font-weight:800;font-size:12px;padding:6px 10px;border-radius:16px;position:relative;min-width:54px}
  #nav button svg{width:24px;height:24px}
  #nav button.active{color:var(--green)}
  #nav button.active .ico{background:var(--green);color:#fff}
  #nav .ico{width:56px;height:34px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  #nav .dot{position:absolute;top:2px;right:12px;width:10px;height:10px;background:var(--red);border-radius:50%;display:none}

  /* ---------- sheet (panel) ---------- */
  #sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;background:var(--cream);border-radius:22px 22px 0 0;z-index:7;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
  #sheet.open{transform:none}
  #sheetHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
  #sheetHead h2{margin:0;font-size:20px;font-weight:900}
  #sheetClose{width:36px;height:36px;border-radius:50%;border:none;background:#ece3d0;font-size:18px;font-weight:900}
  #sheetBody{overflow:auto;padding:4px 18px 18px;touch-action:pan-y;user-select:text;-webkit-user-select:text}
  .item{background:#fff;border:2px solid #eadfca;border-radius:14px;padding:12px 14px;margin:8px 0}
  .item h3{margin:0 0 4px;font-size:15px}
  .item p{margin:0;font-size:14px;color:#3f4a43;line-height:1.4}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  input[type=text],input[type=number]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid #d9cdb4;border-radius:12px;background:#fff;outline:none}
  input:focus{border-color:var(--green2)}
  .btn{background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-weight:900;font-size:15px}
  .btn.alt{background:#ece3d0;color:var(--ink)}
  .btn.small{padding:8px 12px;font-size:13px;flex:0 0 auto}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:#ece3d0;font-size:12px;font-weight:800}
  .ktp{background:linear-gradient(135deg,#cfe4f7,#a9cdee);border:2px solid #6c9cc8;border-radius:16px;padding:14px 16px;color:#16324a;position:relative;overflow:hidden}
  .ktp .t{font-weight:900;letter-spacing:1.5px;font-size:13px;text-align:center;margin-bottom:10px}
  .ktp table{border-collapse:collapse;font-size:14px}
  .ktp td{padding:2px 6px 2px 0;vertical-align:top}
  .ktp td:first-child{font-weight:800;white-space:nowrap}
  .ktp .photo{position:absolute;right:14px;top:44px;width:62px;height:76px;border-radius:8px;background:#e8f1fa;border:2px solid #6c9cc8;display:flex;align-items:center;justify-content:center;font-size:34px}
  #chatLog{max-height:44vh;overflow:auto}
  .msg{padding:6px 0;border-bottom:1px solid #efe6d4;font-size:14px}
  .msg b{margin-right:6px}

  .jgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .jbtn{border:2px solid #e2d6bf;background:#fff;border-radius:14px;padding:10px;text-align:left;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--ink)}
  .jbtn .e{font-size:22px}
  .jbtn small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .jbtn.sel{border-color:var(--jc);box-shadow:0 0 0 3px color-mix(in srgb,var(--jc) 30%,transparent);background:color-mix(in srgb,var(--jc) 9%,#fff)}
  .btn.google{background:#fff;color:#1f1f1f;border:2px solid #d6d6d6;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
  .btn.wide{width:100%}
  .ktm{border-radius:16px;padding:14px 16px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--jc),color-mix(in srgb,var(--jc) 55%,#000))}
  .ktm .t{font-weight:900;letter-spacing:1.5px;font-size:12px;opacity:.95}
  .ktm .u{font-weight:900;font-size:18px;margin:2px 0 10px}
  .ktm table{border-collapse:collapse;font-size:14px}
  .ktm td{padding:2px 8px 2px 0;vertical-align:top}
  .ktm td:first-child{opacity:.8;white-space:nowrap}
  .ktm .photo{position:absolute;right:14px;top:50px;width:64px;height:78px;border-radius:10px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:34px}
  .ktm .bar{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
  .jdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .divider{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 8px}
  textarea{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:2px solid #d9cdb4;border-radius:12px;background:#fff;outline:none;resize:vertical;min-height:70px}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);background:rgba(31,42,36,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:9;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
  @media (max-width:420px){
    #topbar h1{font-size:18px} #datetime{font-size:13px} #ktpBtn{font-size:13px;padding:7px 9px}
    #wargaCard b{font-size:28px} .ctl{width:50px;height:50px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <h1>Kampus Netizen</h1>
  <div id="clock">
    <div id="online"><i></i><span id="onlineTxt">… mahasiswa online</span></div>
    <div id="datetime">—</div>
    <div id="phase">—</div>
  </div>
  <button id="ktpBtn">Bikin KTM</button>
</div>

<div id="wargaCard" class="card">
  <small>MAHASISWA</small>
  <b id="wargaNum">0</b>
  <span id="wargaUpd">—</span>
</div>

<div id="rightCtl">
  <button class="ctl" id="zoomIn" aria-label="Perbesar">+</button>
  <button class="ctl" id="zoomOut" aria-label="Perkecil">−</button>
  <button class="ctl small" id="nearBtn">Dekat</button>
  <button class="ctl" id="soundBtn" aria-label="Suara">🔇</button>
  <button class="ctl" id="homeBtn" aria-label="Ke fakultas">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
  </button>
</div>

<button id="chatTab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  CHAT
</button>

<div id="joy"><div id="knob"></div></div>
<div id="joyLabel">Gerak</div>

<nav id="nav">
  <button data-tab="peta" class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></span>Peta</button>
  <button data-tab="info"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10v4h3l6 4V6L6 10H3zM16 9a4 4 0 0 1 0 6"/></svg></span>Info<i class="dot" id="infoDot"></i></button>
  <button data-tab="ktm"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M14 10h4M14 13h4"/></svg></span>KTM</button>
  <button data-tab="jurusan"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5M22 9v6"/></svg></span>Jurusan</button>
  <button data-tab="kantin"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3M8 20h8"/></svg></span>Kantin</button>
  <button data-tab="akun"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.5 2 3.2-.3.8 3.1 2.6 1.9-1.3 2.9 1.3 2.9-2.6 1.9-.8 3.1-3.2-.3L12 21l-2.5-2-3.2.3-.8-3.1L2.9 14.3 4.2 11.4 2.9 8.5l2.6-1.9.8-3.1 3.2.3z"/><path d="m9 12 2 2 4-4"/></svg></span>Akun</button>
</nav>

<div id="sheet">
  <div id="sheetHead"><h2 id="sheetTitle">—</h2><button id="sheetClose" aria-label="Tutup">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>

<script>
window.KN_CONFIG = { SUPABASE_URL: '', SUPABASE_ANON_KEY: '' };
</script>
<script>
/*
 * world.js — peta Kampus Netizen + data jurusan + bot.
 * Peta & bot dihitung dari seed dan jam, jadi semua pemain melihat hal yang sama
 * tanpa perlu server game (cocok untuk Vercel + Supabase).
 */
(function (root) {
  'use strict';

  var N = 72;
  var T = { GRASS: 0, ROAD: 1, WATER: 2, FIELD: 3, FOREST: 4, PAVE: 5, BANK: 6 };
  var ROADS = [6, 25, 46, 65];

  var JURUSAN = [
    { id: 'komunikasi', nama: 'Ilmu Komunikasi', fak: 'Fak. Ilmu Komunikasi', kode: '01', color: '#e8833a', emoji: '🎙️' },
    { id: 'informatika', nama: 'Informatika', fak: 'Fak. Informatika', kode: '02', color: '#2f6fd6', emoji: '💻' },
    { id: 'manajemen', nama: 'Manajemen', fak: 'Fak. Ekonomi & Bisnis', kode: '03', color: '#2e9b5f', emoji: '📈' },
    { id: 'kesehatan', nama: 'Kesehatan', fak: 'Fak. Ilmu Kesehatan', kode: '04', color: '#16a3a0', emoji: '🩺' },
    { id: 'kedokteran', nama: 'Kedokteran', fak: 'Fak. Kedokteran', kode: '05', color: '#c8323a', emoji: '⚕️' },
    { id: 'ngepunk', nama: 'Ngepunk', fak: 'Fak. Ngepunk', kode: '06', color: '#e0338f', emoji: '🤘' }
  ];
  var JMAP = {}; JURUSAN.forEach(function (j) { JMAP[j.id] = j; });

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(x, y) {
    var h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function generate() {
    var rnd = mulberry32(2026);
    var tiles = new Uint8Array(N * N), blocked = new Uint8Array(N * N);
    var objects = [], deco = [], fakultas = {};
    function idx(x, y) { return y * N + x; }
    function inb(x, y) { return x >= 0 && y >= 0 && x < N && y < N; }
    function set(x, y, t) { if (inb(x, y)) tiles[idx(x, y)] = t; }
    function get(x, y) { return inb(x, y) ? tiles[idx(x, y)] : -1; }
    function fill(x0, y0, w, h, t) { for (var y = y0; y < y0 + h; y++) for (var x = x0; x < x0 + w; x++) set(x, y, t); }
    function block(x0, y0, w, h) { for (var y = y0; y < y0 + h; y++) for (var x = x0; x < x0 + w; x++) if (inb(x, y)) blocked[idx(x, y)] = 1; }
    function bld(o) { o.type = 'building'; objects.push(o); block(o.x, o.y, o.w, o.h); return o; }
    function prop(o) { objects.push(o); if (o.solid) block(Math.floor(o.x), Math.floor(o.y), 1, 1); return o; }

    // 1) dasar: rumput, taman kota di tepi, danau di kanan
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var t = T.GRASS;
      if (x < 5 || y < 5) t = T.FOREST;
      var lakeEdge = 67 + Math.sin(y / 5) * 1.2 + Math.sin(y / 2.3) * 0.5;
      if (y > 14 && y < 62 && x > lakeEdge) t = T.WATER;
      else if (y > 13 && y < 63 && x > lakeEdge - 1.1) t = T.BANK;
      set(x, y, t);
    }

    // 2) jalan kampus (grid) + boulevard ke gerbang
    for (var i = 0; i < ROADS.length; i++) for (var k = 6; k <= 65; k++) { set(ROADS[i], k, T.ROAD); set(k, ROADS[i], T.ROAD); }
    for (var by = 46; by < N; by++) { set(35, by, T.ROAD); set(36, by, T.ROAD); }

    // 3) Rektorat + Bundaran (tengah)
    fill(26, 26, 20, 20, T.PAVE);
    for (var gy = 26; gy < 46; gy++) for (var gx = 26; gx < 46; gx++) {
      var d = Math.hypot(gx + 0.5 - 36, gy + 0.5 - 40);
      if (d > 3 && d < 5.2) set(gx, gy, T.GRASS);           // taman bundaran
      if ((gx < 28 || gx > 43) && gy > 33) set(gx, gy, T.GRASS);
    }
    bld({ kind: 'rektorat', name: '🏛️ Rektorat', x: 30, y: 28, w: 12, h: 5, wall: '#f2ede2', roof: '#8a3b2a', band: '#c9a227', height: 66, roofType: 'hip' });
    prop({ type: 'fountain', x: 36, y: 40, solid: true });
    prop({ type: 'flag', x: 31.5, y: 35.5 }); prop({ type: 'flag', x: 40.5, y: 35.5 });
    deco.push({ type: 'circle', x: 36, y: 40, r: 1.6, color: '#7fb2d6' });

    // 4) Fakultas
    function fak(jid, x, y, w, h, extra) {
      var j = JMAP[jid];
      var o = bld(Object.assign({ kind: 'fakultas', jurusan: jid, name: j.emoji + ' ' + j.fak, x: x, y: y, w: w, h: h, wall: '#f4f1ea', roof: shade(j.color, -0.25), band: j.color, height: 50, roofType: 'flat' }, extra || {}));
      fill(x - 2, y + h, w + 4, 3, T.PAVE);
      fakultas[jid] = { x: x + w / 2, y: y + h + 1.2 };
      return o;
    }
    fak('komunikasi', 10, 11, 10, 4);
    prop({ type: 'dish', x: 21.5, y: 9.5 });
    fak('informatika', 30, 11, 12, 4, { glass: true });
    prop({ type: 'antenna', x: 43.5, y: 10.5 });
    fak('manajemen', 51, 11, 10, 4, { height: 58 });
    fak('kesehatan', 10, 29, 10, 4);
    prop({ type: 'cross', x: 21.6, y: 30.5, color: '#16a3a0' });
    fak('kedokteran', 51, 28, 10, 4, { height: 56 });
    bld({ kind: 'rs', name: '🏥 RS Pendidikan', x: 51, y: 37, w: 7, h: 4, wall: '#ffffff', roof: '#b9c3c9', band: '#c8323a', height: 40, roofType: 'flat' });
    fill(49, 41, 11, 2, T.PAVE);
    prop({ type: 'ambulance', x: 60.5, y: 42 });
    fak('ngepunk', 10, 49, 9, 4, { wall: '#3a3a3f', roof: '#1f1f22', height: 44, punk: true });
    fill(10, 56, 11, 7, T.PAVE);
    bld({ kind: 'stage', name: '🎸 Panggung', x: 13, y: 57, w: 5, h: 3, wall: '#2b2b2b', roof: '#e0338f', height: 7, roofType: 'flat' });
    prop({ type: 'speaker', x: 12.4, y: 58.5 }); prop({ type: 'speaker', x: 18.6, y: 58.5 });

    // 5) Kantin & Perpustakaan (kiri-kanan boulevard)
    fill(26, 47, 9, 18, T.PAVE);
    var stallColors = ['#e24b3b', '#3f8fd0', '#f0b429', '#4caf50'];

<script>
/*
 * net.js — lapisan jaringan.
 *  - SupaNet: Supabase (Auth tamu + Google, Realtime presence/broadcast, Postgres)
 *  - DemoNet: tanpa server, semua disimpan di browser
 * Keduanya punya method yang sama, jadi game.js tidak peduli sedang pakai yang mana.
 */
(function () {
  'use strict';

  function lget(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  function ldel(k) { try { localStorage.removeItem(k); } catch (e) { } }
  function errMsg(e) {
    var m = (e && (e.message || e.error_description || e.msg)) || String(e);
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Koneksi bermasalah, coba lagi';
    if (/manual linking/i.test(m)) return 'Aktifkan "Manual Linking" di Supabase Auth dulu';
    if (/identity.*already/i.test(m)) return 'Akun Google ini sudah punya KTM. Pakai "Masuk dengan Google".';
    if (/provider is not enabled/i.test(m)) return 'Login Google belum diaktifkan di Supabase';
    if (/anonymous sign-ins are disabled/i.test(m)) return 'Aktifkan "Anonymous sign-ins" di Supabase Auth';
    return m;
  }
  function guestOf(id) { return 'Tamu ' + String(id).replace(/[^a-z0-9]/gi, '').slice(0, 4).toUpperCase(); }

  // =====================================================================
  // Supabase
  // =====================================================================
  function SupaNet(cfg, H) {
    var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    var user = null, profile = null, ch = null;
    var known = new Set(), metaQueue = new Set(), metaTimer = null, metaWaiters = {};
    var api = { mode: 'online', guestOf: guestOf };
    function redirectTo() { return location.origin + location.pathname; }
    function selfInfo() {
      var email = user && user.email;
      if (!email && user && user.identities) user.identities.forEach(function (i) { if (i.identity_data && i.identity_data.email) email = i.identity_data.email; });
      return { id: user.id, isAnon: !!user.is_anonymous, email: email || null, guestName: guestOf(user.id) };
    }

    api.start = async function () {
      // error dari redirect Google (mis. akun Google sudah dipakai)
      var q = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
      var urlErr = q.get('error_description');
      if (urlErr) { ldel('kn_pending_ktm'); setTimeout(function () { H.toast(errMsg({ message: urlErr })); }, 600); history.replaceState(null, '', redirectTo()); }

      var r = await sb.auth.getSession();
      var session = r.data && r.data.session;
      if (!session) {
        var a = await sb.auth.signInAnonymously();
        if (a.error) throw a.error;
        session = a.data.session;
      }
      user = session.user;
      sb.auth.onAuthStateChange(function (ev, s) {
        if (!s) return;
        if (user && s.user.id !== user.id) { location.reload(); return; }
        user = s.user; H.onSelf(selfInfo());
      });
      H.onSelf(selfInfo());
      await loadProfile();

      // lanjutkan pendaftaran KTM yang tertunda karena pindah ke halaman Google
      var pend = lget('kn_pending_ktm');
      if (pend) {
        ldel('kn_pending_ktm');
        if (!profile && !user.is_anonymous) {
          try { await api.daftarKTM(pend.nama, pend.jurusan); } catch (e) { H.toast(errMsg(e)); H.openKTM(); }
        }
      }
      joinChannel();
      loadKantin(); loadPengumuman(); loadChatHistory(); refreshStats();
      setInterval(refreshStats, 60000);
    };

    async function loadProfile() {
      var r = await sb.from('mahasiswa').select('*').eq('id', user.id).maybeSingle();
      if (r.error) { H.toast(errMsg(r.error)); return; }
      profile = r.data || null;
      H.onProfile(profile);
    }

    function joinChannel() {
      ch = sb.channel('kampus-netizen', { config: { presence: { key: user.id }, broadcast: { self: false } } });
      ch.on('presence', { event: 'sync' }, function () {
        var st = ch.presenceState(), ids = Object.keys(st);

      });
      ch.on('broadcast', { event: 'p' }, function (m) { var p = m.payload; if (p && p.i !== user.id) H.onPeerPos(p.i, +p.x, +p.y, +p.vx || 0, +p.vy || 0); });
      ch.on('broadcast', { event: 'hi' }, function () { H.onHello(); });
      ch.on('broadcast', { event: 'ktm' }, function (m) { if (m.payload && m.payload.i) requestMeta(m.payload.i); refreshStats(); });
      ch.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat' }, function (m) {
        var row = m.new; if (!row || row.user_id === user.id) return;

      });
      ch.on('postgres_changes', { event: '*', schema: 'public', table: 'kantin' }, function () { clearTimeout(api._kt); api._kt = setTimeout(loadKantin, 300); });

          ch.send({ type: 'broadcast', event: 'hi', payload: {} });

          H.onConnected(false);

    // ambil data KTM pemain lain (dikumpulkan dulu supaya 1 query untuk banyak orang)
    function requestMeta(id) {

    }
    function ensureMeta(id) {

    }
    async function flushMeta() {
      var ids = Array.from(metaQueue); metaQueue.clear();
      if (!ids.length) return;
      var r = await sb.from('mahasiswa').select('id,nama,jurusan,nim,is_dekan,role').in('id', ids);
      var found = {};
      (r.data || []).forEach(function (row) { found[row.id] = row; });
      ids.forEach(function (id) {
        H.onPeerMeta(id, found[id] || null);
        (metaWaiters[id] || []).forEach(function (f) { f(); }); delete metaWaiters[id];

    }

    async function refreshStats() {
      var r = await sb.from('mahasiswa').select('id', { count: 'exact', head: true });
      if (!r.error) H.onMahasiswaCount(r.count || 0);
    }
    async function loadKantin() {
      var r = await sb.from('kantin').select('id,barang,harga,created_at,user_id,mahasiswa(nama,jurusan)').order('created_at', { ascending: false }).limit(50);
      if (r.error) return;
      H.onKantin(r.data.map(function (k) {
        return { id: k.id, barang: k.barang, harga: k.harga, at: Date.parse(k.created_at), seller: k.mahasiswa ? k.mahasiswa.nama : '?', jurusan: k.mahasiswa ? k.mahasiswa.jurusan : null, mine: k.user_id === user.id };
      }));
    }
    async function loadPengumuman(isNew) {
      var r = await sb.from('pengumuman').select('id,judul,isi,created_at').order('created_at', { ascending: false }).limit(20);
      if (!r.error) H.onPengumuman(r.data.map(function (p) { return { judul: p.judul, isi: p.isi, at: Date.parse(p.created_at) }; }), !!isNew);
    }
    async function loadChatHistory() {
      var r = await sb.from('chat').select('user_id,teks,created_at').order('created_at', { ascending: false }).limit(30);
      if (r.error || !r.data.length) return;
      var rows = r.data.reverse();
      await Promise.all(rows.map(function (x) { return x.user_id === user.id ? null : ensureMeta(x.user_id); }));
      rows.forEach(function (x) { H.onChat(x.user_id, x.teks, Date.parse(x.created_at), true); });
    }

    api.daftarKTM = async function (nama, jurusan) {
      if (cfg.WAJIB_GOOGLE_UNTUK_KTM && user.is_anonymous) {
        lset('kn_pending_ktm', { nama: nama, jurusan: jurusan });
        var l = await sb.auth.linkIdentity({ provider: 'google', options: { redirectTo: redirectTo() } });

      H.onProfile(profile, true);
      if (ch) ch.send({ type: 'broadcast', event: 'ktm', payload: { i: user.id } });

      return profile;
    };
    api.loginGoogle = async function () {
      var r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectTo() } });
      if (r.error) throw r.error;
    };
    api.logout = async function () { await sb.auth.signOut(); location.reload(); };
    api.sendPos = function (x, y, vx, vy) {
      if (ch) ch.send({ type: 'broadcast', event: 'p', payload: { i: user.id, x: +x.toFixed(2), y: +y.toFixed(2), vx: +vx.toFixed(2), vy: +vy.toFixed(2) } });
    };
    api.sendChat = async function (teks) {
      var r = await sb.from('chat').insert({ teks: teks });
      if (r.error) throw r.error;
    };
    api.jual = async function (barang, harga) {
      var r = await sb.from('kantin').insert({ barang: barang, harga: harga });
      if (r.error) throw r.error;

      var r = await sb.from('pengumuman').insert({ judul: judul, isi: isi });
      if (r.error) throw r.error;

    };

      var r = await sb.rpc('statistik_jurusan');
      if (r.error) throw r.error;
      return r.data;
    };
    return api;
  }

  // =====================================================================
  // Demo (tanpa Supabase)
  // =====================================================================
  function DemoNet(cfg, H) {

        teman.slice(0, 20).forEach(function (o) {
          b.appendChild(el('div', { cls: 'item row' }, [el('div', {}, [el('h3', { text: o.label }), el('div', { cls: 'meta', text: jarak(o) })]),
            el('button', { cls: 'btn small alt', text: 'Sapa', onclick: function () { sendChat('Halo ' + o.name + ' 👋'); closePanel(); } })]));
        });
      } else {
        b.appendChild(el('div', { cls: 'item' }, [el('h3', { text: 'Belum punya jurusan' }), el('p', { text: 'Bikin KTM untuk masuk jurusan.' })]));
        b.appendChild(el('button', { cls: 'btn wide', text: 'Bikin KTM', onclick: function () { openPanel('ktm'); } }));
      }
      b.appendChild(el('h3', { text: 'Semua jurusan', style: 'margin:16px 0 6px;font-size:15px' }));
      b.appendChild(holder);
      net.statJurusan().then(function (rows) {
        var map = {}; (rows || []).forEach(function (r) { map[r.jurusan] = r; });
        holder.innerHTML = '';
        World.JURUSAN.forEach(function (jj) {
          var r = map[jj.id] || { jumlah: 0, dekan: null };
          holder.appendChild(el('div', { cls: 'item' }, [el('h3', {}, [el('span', { cls: 'jdot', style: 'background:' + jj.color }), jj.emoji + ' ' + jj.nama]),
            el('div', { cls: 'meta', text: Number(r.jumlah).toLocaleString('id-ID') + ' mahasiswa · Dekan: ' + (r.dekan || 'belum ada — daftar sekarang!') })]));
        });
      }).catch(function (e) { holder.innerHTML = ''; holder.appendChild(el('p', { cls: 'muted', text: Net.errMsg(e) })); });
    },
    kantin: function (b) {
      if (me.profile) {
        var it = el('input', { type: 'text', maxlength: '60', placeholder: 'Mau jual apa?' });
        var pr = el('input', { type: 'number', min: '0', placeholder: 'Harga (Rp)', inputmode: 'numeric' });
        var bt = el('button', { cls: 'btn', text: 'Pajang' });
        bt.onclick = function () {
          var barang = it.value.trim(), harga = Math.max(0, Math.min(1e9, parseInt(pr.value, 10) || 0));
          if (!barang) { toast('Isi nama barangnya'); return; }
          busy(bt, true);
          net.jual(barang, harga).then(function () { toast('Barang dipajang di Kantin 🍜'); }).catch(function (e) { toast(Net.errMsg(e)); }).then(function () { busy(bt, false); });
        };
        b.appendChild(el('div', { cls: 'item' }, [el('h3', { text: 'Jualan' }), el('div', { style: 'display:grid;gap:8px;margin-top:6px' }, [it, el('div', { cls: 'row' }, [pr, bt])])]));
      } else b.appendChild(el('p', { cls: 'muted', text: 'Bikin KTM dulu untuk bisa jualan. Lihat-lihat boleh kok.' }));
      if (!kantin.length) b.appendChild(el('p', { cls: 'muted', text: 'Belum ada jualan. Jadilah yang pertama!' }));
      kantin.forEach(function (m) {
        var j = m.jurusan && JMAP[m.jurusan];
        var act = m.mine
          ? el('button', { cls: 'btn small alt', text: 'Hapus', onclick: function () { net.hapusJualan(m.id).catch(function (e) { toast(Net.errMsg(e)); }); } })
          : el('button', { cls: 'btn small alt', text: 'Tanya', onclick: function () { sendChat('@' + m.seller + ' ' + m.barang + ' masih ada?'); closePanel(); } });
        b.appendChild(el('div', { cls: 'item row' }, [
          el('div', {}, [el('h3', { text: m.barang }), el('div', { cls: 'meta' }, [j ? el('span', { cls: 'jdot', style: 'background:' + j.color }) : null, rupiah(m.harga) + ' · ' + m.seller + ' · ' + fmtDate(m.at)])]),
          act
        ]));
      });
    },
    akun: function (b) {
      var status = net.mode === 'demo' ? 'Mode demo (offline) — mahasiswa lain adalah bot' : (me.isAnon ? 'Masuk sebagai tamu' : 'Masuk dengan Google' + (me.email ? ' (' + me.email + ')' : ''));
      b.appendChild(el('div', { cls: 'item' }, [el('h3', { text: me.label }), el('p', { text: me.profile ? (JMAP[me.profile.jurusan].nama + ' · NIM ' + me.profile.nim) : 'Belum punya KTM' }), el('div', { cls: 'meta', text: status })]));
      if (net.mode === 'online' && me.isAnon) b.appendChild(googleBtn('Masuk dengan Google', function () { net.loginGoogle().catch(function (e) { toast(Net.errMsg(e)); }); }));
      b.appendChild(el('div', { cls: 'row', style: 'margin:10px 0' }, [el('button', { cls: 'btn alt', text: soundOn ? '🔊 Suara: nyala' : '🔇 Suara: mati', onclick: function () { $('soundBtn').click(); refreshPanel(); } })]));
      if (me.profile || !me.isAnon) {
        var out = el('button', { cls: 'btn alt wide', text: 'Keluar' });
        var armed = 0;
        out.onclick = function () {
          if (Date.now() - armed > 4000) { armed = Date.now(); toast(net.mode === 'demo' ? 'Tekan lagi: KTM demo di browser ini akan dihapus' : 'Tekan sekali lagi untuk keluar'); return; }
          net.logout();
        };
        b.appendChild(out);
      }
      b.appendChild(el('p', { cls: 'muted', style: 'margin-top:14px' }, ['Kampus Netizen · kampus virtual. ', el('a', { href: 'privasi.html', target: '_blank', text: 'Kebijakan Privasi' })]));
    },
    chat: function (b) {
      b.appendChild(el('div', { id: 'chatLog' }));
      var inp = el('input', { type: 'text', id: 'chatInput', maxlength: '120', placeholder: 'Ketik pesan…', autocomplete: 'off', enterkeyhint: 'send' });
      function go() { sendChat(inp.value); inp.value = ''; }
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
      b.appendChild(el('div', { cls: 'row', style: 'margin-top:10px' }, [inp, el('button', { cls: 'btn small', text: 'Kirim', onclick: go })]));
      renderChatLog();
    },
    dekat: function (b) {
      var arr = [];
      allPlayers().forEach(function (p) { if (p === me) return; var d = Math.hypot(p.x - me.x, p.y - me.y); if (d < 20) arr.push([d, p]); });
      arr.sort(function (a, c) { return a[0] - c[0]; });
      if (!arr.length) b.appendChild(el('p', { cls: 'muted', text: 'Sepi… belum ada yang di sekitarmu.' }));
      arr.slice(0, 30).forEach(function (a) {
        var p = a[1], j = p.jurusan && JMAP[p.jurusan];
        b.appendChild(el('div', { cls: 'item row' }, [el('div', {}, [el('h3', {}, [j ? el('span', { cls: 'jdot', style: 'background:' + j.color }) : null, p.label]), el('div', { cls: 'meta', text: (j ? j.nama + ' · ' : '') + jarak(p) })]),
          el('button', { cls: 'btn small alt', text: 'Sapa', onclick: function () { sendChat('Halo ' + p.name + ' 👋'); closePanel(); } })]));
      });
    }
  };
  function jarak(p) { return '± ' + Math.round(Math.hypot(p.x - me.x, p.y - me.y) * 5) + ' m dari kamu'; }

  // ---------- mulai ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt, now);
    render(now, dt);
    requestAnimationFrame(frame);
  }
  fontFamily = getComputedStyle(document.body).fontFamily;
  hud();
  net.start().catch(function (e) { console.error(e); toast('Gagal terhubung: ' + Net.errMsg(e)); });
  requestAnimationFrame(frame);

  window.KN = { world: world, me: me, peers: peers, bots: bots, openPanel: openPanel, setZoom: setZoom, net: net, sendChat: sendChat };
})();

</script>
</body>
</html>
