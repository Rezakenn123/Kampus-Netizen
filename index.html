<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f4a3a">
<title>Kampus Netizen</title>
<style>
  :root{
    --green:#2f4a3a; --green2:#3f6650; --cream:#fffaf0; --cream2:#f6eedc; --brown:#8a6240;
    --ink:#1f2a24; --muted:#6c7a70; --gold:#f2c94c; --red:#e2483d;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#7fb069;font-family:var(--font);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  canvas#game{position:fixed;inset:0;display:block}
  button{font-family:inherit;cursor:pointer}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  #topbar h1{margin:0;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:22px;font-weight:900;letter-spacing:.2px;white-space:nowrap}
  #clock{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  #online{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
  #online i{width:9px;height:9px;border-radius:50%;background:#5ee07a;display:inline-block;box-shadow:0 0 0 3px rgba(94,224,122,.25)}
  #datetime{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
  #phase{background:#ffe9a8;color:#7a5a12;font-size:12px;font-weight:900;letter-spacing:2px;padding:2px 12px;border-radius:999px;white-space:nowrap}
  #ktpBtn{flex:0 0 auto;background:var(--cream);color:var(--ink);border:3px solid var(--brown);border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}

  /* ---------- cards & controls ---------- */
  .card{background:var(--cream);border:3px solid var(--brown);border-radius:16px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #wargaCard{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 84px);padding:10px 16px;z-index:4;pointer-events:none}
  #wargaCard small{display:block;font-size:12px;font-weight:900;letter-spacing:3px;color:var(--brown)}
  #wargaCard b{display:block;font-size:34px;font-weight:900;line-height:1.05}
  #wargaCard span{font-size:11px;color:var(--muted)}
  #rightCtl{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 84px);display:flex;flex-direction:column;gap:10px;z-index:4}
  .ctl{width:56px;height:56px;border-radius:14px;background:var(--cream);border:3px solid var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:26px;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
  .ctl.small{font-size:13px}
  .ctl:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #chatTab{position:fixed;left:-14px;top:52%;transform:translateY(-50%);background:var(--green);color:#fff;border:none;border-radius:0 40px 40px 0;padding:16px 14px 14px 26px;font-weight:900;font-size:11px;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  #chatTab svg{width:26px;height:26px}

  /* ---------- joystick ---------- */
  #joy{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom) + 96px);width:150px;height:150px;border-radius:50%;background:rgba(40,60,50,.35);border:3px solid rgba(255,255,255,.35);z-index:4;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--cream);border:4px solid var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.25)}
  #joyLabel{position:fixed;left:20px;width:150px;text-align:center;bottom:calc(env(safe-area-inset-bottom) + 76px);color:#fff;font-weight:900;letter-spacing:2px;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:4;pointer-events:none}

  /* ---------- bottom nav ---------- */
  #nav{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1px solid #e5dccb;display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:6}
  #nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#8f978f;font-weight:800;font-size:12px;padding:6px 10px;border-radius:16px;position:relative;min-width:54px}
  #nav button svg{width:24px;height:24px}
  #nav button.active{color:var(--green)}
  #nav button.active .ico{background:var(--green);color:#fff}
  #nav .ico{width:56px;height:34px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  #nav .dot{position:absolute;top:2px;right:12px;width:10px;height:10px;background:var(--red);border-radius:50%;display:none}

  /* ---------- sheet (panel) ---------- */
  #sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;background:var(--cream);border-radius:22px 22px 0 0;z-index:7;transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom)}
  #sheet.open{transform:none}
  #sheetHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
  #sheetHead h2{margin:0;font-size:20px;font-weight:900}
  #sheetClose{width:36px;height:36px;border-radius:50%;border:none;background:#ece3d0;font-size:18px;font-weight:900}
  #sheetBody{overflow:auto;padding:4px 18px 18px;touch-action:pan-y;user-select:text;-webkit-user-select:text}
  .item{background:#fff;border:2px solid #eadfca;border-radius:14px;padding:12px 14px;margin:8px 0}
  .item h3{margin:0 0 4px;font-size:15px}
  .item p{margin:0;font-size:14px;color:#3f4a43;line-height:1.4}
  .meta{font-size:12px;color:var(--muted);margin-top:4px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  input[type=text],input[type=number]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2px solid #d9cdb4;border-radius:12px;background:#fff;outline:none}
  input:focus{border-color:var(--green2)}
  .btn{background:var(--green);color:#fff;border:none;border-radius:12px;padding:12px 16px;font-weight:900;font-size:15px}
  .btn.alt{background:#ece3d0;color:var(--ink)}
  .btn.small{padding:8px 12px;font-size:13px;flex:0 0 auto}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:#ece3d0;font-size:12px;font-weight:800}
  .ktp{background:linear-gradient(135deg,#cfe4f7,#a9cdee);border:2px solid #6c9cc8;border-radius:16px;padding:14px 16px;color:#16324a;position:relative;overflow:hidden}
  .ktp .t{font-weight:900;letter-spacing:1.5px;font-size:13px;text-align:center;margin-bottom:10px}
  .ktp table{border-collapse:collapse;font-size:14px}
  .ktp td{padding:2px 6px 2px 0;vertical-align:top}
  .ktp td:first-child{font-weight:800;white-space:nowrap}
  .ktp .photo{position:absolute;right:14px;top:44px;width:62px;height:76px;border-radius:8px;background:#e8f1fa;border:2px solid #6c9cc8;display:flex;align-items:center;justify-content:center;font-size:34px}
  #chatLog{max-height:44vh;overflow:auto}
  .msg{padding:6px 0;border-bottom:1px solid #efe6d4;font-size:14px}
  .msg b{margin-right:6px}

  .jgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .jbtn{border:2px solid #e2d6bf;background:#fff;border-radius:14px;padding:10px;text-align:left;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;color:var(--ink)}
  .jbtn .e{font-size:22px}
  .jbtn small{display:block;font-weight:600;color:var(--muted);font-size:11px}
  .jbtn.sel{border-color:var(--jc);box-shadow:0 0 0 3px color-mix(in srgb,var(--jc) 30%,transparent);background:color-mix(in srgb,var(--jc) 9%,#fff)}
  .btn.google{background:#fff;color:#1f1f1f;border:2px solid #d6d6d6;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
  .btn.wide{width:100%}
  .ktm{border-radius:16px;padding:14px 16px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--jc),color-mix(in srgb,var(--jc) 55%,#000))}
  .ktm .t{font-weight:900;letter-spacing:1.5px;font-size:12px;opacity:.95}
  .ktm .u{font-weight:900;font-size:18px;margin:2px 0 10px}
  .ktm table{border-collapse:collapse;font-size:14px}
  .ktm td{padding:2px 8px 2px 0;vertical-align:top}
  .ktm td:first-child{opacity:.8;white-space:nowrap}
  .ktm .photo{position:absolute;right:14px;top:50px;width:64px;height:78px;border-radius:10px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:34px}
  .ktm .bar{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
  .jdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .divider{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 8px}
  textarea{width:100%;font:inherit;font-size:15px;padding:12px 14px;border:2px solid #d9cdb4;border-radius:12px;background:#fff;outline:none;resize:vertical;min-height:70px}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);background:rgba(31,42,36,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:9;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
  @media (max-width:420px){
    #topbar h1{font-size:18px} #datetime{font-size:13px} #ktpBtn{font-size:13px;padding:7px 9px}
    #wargaCard b{font-size:28px} .ctl{width:50px;height:50px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <h1>Kampus Netizen</h1>
  <div id="clock">
    <div id="online"><i></i><span id="onlineTxt">… mahasiswa online</span></div>
    <div id="datetime">—</div>
    <div id="phase">—</div>
  </div>
  <button id="ktpBtn">Bikin KTM</button>
</div>

<div id="wargaCard" class="card">
  <small>MAHASISWA</small>
  <b id="wargaNum">0</b>
  <span id="wargaUpd">—</span>
</div>

<div id="rightCtl">
  <button class="ctl" id="zoomIn" aria-label="Perbesar">+</button>
  <button class="ctl" id="zoomOut" aria-label="Perkecil">−</button>
  <button class="ctl small" id="nearBtn">Dekat</button>
  <button class="ctl" id="soundBtn" aria-label="Suara">🔇</button>
  <button class="ctl" id="homeBtn" aria-label="Ke fakultas">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
  </button>
</div>

<button id="chatTab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  CHAT
</button>

<div id="joy"><div id="knob"></div></div>
<div id="joyLabel">Gerak</div>

<nav id="nav">
  <button data-tab="peta" class="active"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></span>Peta</button>
  <button data-tab="info"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10v4h3l6 4V6L6 10H3zM16 9a4 4 0 0 1 0 6"/></svg></span>Info<i class="dot" id="infoDot"></i></button>
  <button data-tab="ktm"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M14 10h4M14 13h4"/></svg></span>KTM</button>
  <button data-tab="jurusan"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c2 2 10 2 12 0v-5M22 9v6"/></svg></span>Jurusan</button>
  <button data-tab="kantin"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3M8 20h8"/></svg></span>Kantin</button>
  <button data-tab="akun"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.5 2 3.2-.3.8 3.1 2.6 1.9-1.3 2.9 1.3 2.9-2.6 1.9-.8 3.1-3.2-.3L12 21l-2.5-2-3.2.3-.8-3.1L2.9 14.3 4.2 11.4 2.9 8.5l2.6-1.9.8-3.1 3.2.3z"/><path d="m9 12 2 2 4-4"/></svg></span>Akun</button>
</nav>

<div id="sheet">
  <div id="sheetHead"><h2 id="sheetTitle">—</h2><button id="sheetClose" aria-label="Tutup">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/world.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
</body>
</html>
